<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6f8e"/>
      <stop offset=".45" stop-color="#714B67"/>
      <stop offset="1" stop-color="#4a2f43"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="tire" cx=".35" cy=".35" r=".9">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset=".7" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#ff5722" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .car { animation: drive 8s linear infinite; }
    @keyframes drive {
      from { transform: translateX(-380px); }
      to   { transform: translateX(1380px); }
    }
    .spokes { animation: spin .3s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .track { stroke-dasharray: 40 30; animation: dash .8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -70; } }
    .flame { animation: flick .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
    @keyframes flick { from { opacity: .95; transform: scaleX(1); } to { opacity: .5; transform: scaleX(.55); } }
    .haze { animation: haze 1.2s ease-in-out infinite alternate; }
    @keyframes haze { from { opacity: .5; } to { opacity: .15; } }
  </style>

  <!-- track -->
  <line class="track" x1="0" y1="140" x2="1000" y2="140" stroke="#9e9e9e" stroke-width="4" opacity=".55"/>

  <g class="car">
    <!-- ground shadow -->
    <ellipse cx="190" cy="136" rx="170" ry="6" fill="#000" opacity=".28" filter="url(#soft)"/>

    <!-- speed lines -->
    <g stroke="#b89ab0" stroke-width="3" stroke-linecap="round" class="haze">
      <line x1="-70" y1="72" x2="-14" y2="72"/>
      <line x1="-90" y1="92" x2="-22" y2="92"/>
      <line x1="-64" y1="112" x2="-16" y2="112"/>
    </g>

    <!-- exhaust flame -->
    <path class="flame" d="M56 88 L10 84 Q0 88 10 92 L56 96 Z" fill="url(#flame)"/>

    <!-- rear wing: endplate + two planes + pylon -->
    <rect x="30" y="56" width="8" height="46" rx="2" fill="url(#carbon)"/>
    <rect x="32" y="58" width="56" height="8" rx="3" fill="url(#carbon)"/>
    <rect x="32" y="70" width="50" height="6" rx="3" fill="url(#carbon)"/>
    <rect x="54" y="76" width="6" height="26" fill="url(#carbon)"/>

    <!-- shark fin -->
    <path d="M100 80 L142 78 L134 66 Q110 68 100 80 Z" fill="#4a2f43"/>

    <!-- body: engine cover, cockpit, low nose -->
    <path d="M96 118
             Q60 114 56 104
             Q64 82 128 78
             L146 80
             Q160 76 172 80
             L186 86
             Q210 92 236 96
             Q290 102 332 106
             Q338 108 334 112
             L300 114
             Q240 114 190 112
             Z" fill="url(#body)"/>
    <!-- top sheen -->
    <path d="M148 82 L186 88 Q240 96 326 107 L322 110 Q240 99 184 91 L146 85 Z" fill="url(#highlight)"/>
    <!-- sidepod intake -->
    <path d="M150 92 Q176 88 202 94 L198 106 Q168 106 150 104 Z" fill="#3d2938"/>
    <!-- floor plank -->
    <path d="M98 116 L302 111 L300 115 L100 120 Z" fill="#2b1c27"/>

    <!-- halo -->
    <path d="M146 82 Q168 60 192 84" fill="none" stroke="url(#carbon)" stroke-width="6" stroke-linecap="round"/>
    <line x1="169" y1="64" x2="169" y2="80" stroke="url(#carbon)" stroke-width="5"/>
    <!-- helmet -->
    <circle cx="168" cy="76" r="9" fill="#e8e8e8"/>
    <path d="M161 74 Q168 68 175 74" stroke="#c62828" stroke-width="3" fill="none"/>
    <rect x="164" y="72" width="8" height="4" rx="2" fill="#263238"/>
    <!-- mirror -->
    <rect x="148" y="74" width="8" height="5" rx="1" fill="#3d2938"/>

    <!-- front wing: swept planes + endplate -->
    <path d="M298 124 L346 120 Q350 121 346 124 L300 129 Q294 128 298 124 Z" fill="url(#carbon)"/>
    <path d="M312 117 L346 114 Q349 115 346 118 L314 121 Q309 120 312 117 Z" fill="url(#carbon)"/>
    <path d="M330 112 L336 112 L336 122 L330 122 Z" fill="url(#carbon)"/>
    <rect x="344" y="108" width="5" height="20" rx="2" fill="url(#carbon)"/>

    <!-- rear wheel -->
    <g>
      <circle cx="78" cy="110" r="24" fill="url(#tire)"/>
      <circle cx="78" cy="110" r="24" fill="none" stroke="#000" stroke-width="2" opacity=".5"/>
      <circle cx="78" cy="110" r="12" fill="#9aa0a6"/>
      <g class="spokes" stroke="#dcdcdc" stroke-width="2.5" stroke-linecap="round">
        <line x1="78" y1="99" x2="78" y2="121"/>
        <line x1="67.5" y1="106.6" x2="88.5" y2="113.4"/>
        <line x1="71.5" y1="119" x2="84.5" y2="101"/>
      </g>
      <circle cx="78" cy="110" r="3.5" fill="#714B67"/>
    </g>
    <!-- front wheel -->
    <g>
      <circle cx="262" cy="112" r="22" fill="url(#tire)"/>
      <circle cx="262" cy="112" r="22" fill="none" stroke="#000" stroke-width="2" opacity=".5"/>
      <circle cx="262" cy="112" r="11" fill="#9aa0a6"/>
      <g class="spokes" stroke="#dcdcdc" stroke-width="2.5" stroke-linecap="round">
        <line x1="262" y1="102" x2="262" y2="122"/>
        <line x1="252.8" y1="109" x2="271.2" y2="115"/>
        <line x1="256.2" y1="120" x2="267.8" y2="104"/>
      </g>
      <circle cx="262" cy="112" r="3" fill="#714B67"/>
    </g>

    <!-- number 5 (Vettel) -->
    <text x="112" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" opacity=".9">5</text>
  </g>
</svg>
