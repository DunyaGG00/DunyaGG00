<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a55"/>
      <stop offset=".4" stop-color="#dc0000"/>
      <stop offset="1" stop-color="#6e0000"/>
    </linearGradient>
    <linearGradient id="endplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e83a2d"/>
      <stop offset="1" stop-color="#8a0000"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="tire" cx=".35" cy=".35" r=".9">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset=".7" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#ff5722" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .car { animation: drive 8s linear infinite; }
    @keyframes drive {
      from { transform: translateX(-380px); }
      to   { transform: translateX(1380px); }
    }
    .spokes { animation: spin .3s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flame { animation: flick .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
    @keyframes flick { from { opacity: .95; transform: scaleX(1); } to { opacity: .5; transform: scaleX(.55); } }
    .haze { animation: haze 1.2s ease-in-out infinite alternate; }
    @keyframes haze { from { opacity: .45; } to { opacity: .12; } }
    .spark { animation: spark .5s linear infinite; transform-box: fill-box; }
    @keyframes spark {
      from { transform: translate(0, 0); opacity: 1; }
      to   { transform: translate(-48px, 12px); opacity: 0; }
    }
    .s2 { animation-delay: .12s; } .s3 { animation-delay: .25s; } .s4 { animation-delay: .38s; }
  </style>

  <!-- kerb: static red/white strip (camera is fixed; only the car moves) -->
  <line x1="0" y1="140" x2="1000" y2="140" stroke="#e10600" stroke-width="6" opacity=".9"/>
  <line x1="0" y1="140" x2="1000" y2="140" stroke="#fafafa" stroke-width="6" stroke-dasharray="35 35"/>

  <g class="car">
    <!-- ground shadow -->
    <ellipse cx="190" cy="136" rx="170" ry="6" fill="#000" opacity=".3" filter="url(#soft)"/>

    <!-- speed lines -->
    <g stroke="#e0b3ab" stroke-width="3" stroke-linecap="round" class="haze">
      <line x1="-70" y1="72" x2="-14" y2="72"/>
      <line x1="-90" y1="92" x2="-22" y2="92"/>
      <line x1="-64" y1="112" x2="-16" y2="112"/>
    </g>

    <!-- exhaust flame -->
    <path class="flame" d="M56 88 L10 84 Q0 88 10 92 L56 96 Z" fill="url(#flame)"/>

    <!-- rear wing: red endplate + carbon planes + pylon -->
    <rect x="29" y="54" width="9" height="48" rx="3" fill="url(#endplate)"/>
    <path d="M34 58 L88 60 Q92 61 88 65 L34 66 Q30 62 34 58 Z" fill="url(#carbon)"/>
    <path d="M34 70 L82 71 Q85 72 82 75 L34 76 Q31 73 34 70 Z" fill="url(#carbon)"/>
    <rect x="54" y="76" width="6" height="26" rx="2" fill="url(#carbon)"/>

    <!-- shark fin with tricolore -->
    <path d="M100 80 L142 78 L134 66 Q110 68 100 80 Z" fill="#a80000"/>
    <g transform="rotate(-6 122 71)">
      <rect x="113" y="67" width="4" height="9" fill="#009246"/>
      <rect x="117" y="67" width="4" height="9" fill="#f4f5f0"/>
      <rect x="121" y="67" width="4" height="9" fill="#ce2b37"/>
    </g>

    <!-- body: engine cover, cockpit, low needle nose -->
    <path d="M96 118
             Q58 114 54 103
             Q60 80 126 76
             L144 78
             Q158 73 174 79
             L188 85
             Q214 91 242 95
             Q296 102 336 106
             Q342 108 337 112
             L302 114
             Q238 115 188 112
             Z" fill="url(#body)"/>
    <!-- top sheen -->
    <path d="M146 81 L188 87 Q244 95 330 107 L326 110 Q242 98 184 90 L144 84 Z" fill="url(#highlight)"/>
    <!-- nose glint -->
    <path d="M242 95 Q296 102 334 106" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
    <!-- sidepod gloss -->
    <ellipse cx="204" cy="99" rx="42" ry="4.5" fill="#ffffff" opacity=".14" transform="rotate(4 204 99)"/>
    <!-- sidepod intake -->
    <path d="M150 92 Q176 88 202 94 L198 106 Q168 106 150 104 Z" fill="#550000"/>
    <!-- floor plank -->
    <path d="M98 116 L302 111 L300 115 L100 120 Z" fill="#1a1a1a"/>

    <!-- halo -->
    <path d="M146 82 Q168 60 192 84" fill="none" stroke="url(#carbon)" stroke-width="6" stroke-linecap="round"/>
    <line x1="169" y1="64" x2="169" y2="80" stroke="url(#carbon)" stroke-width="5"/>
    <!-- helmet -->
    <circle cx="168" cy="76" r="9" fill="#f2f2f2"/>
    <path d="M161 74 Q168 68 175 74" stroke="#c62828" stroke-width="3" fill="none"/>
    <rect x="164" y="72" width="8" height="4" rx="2" fill="#263238"/>
    <circle cx="171" cy="71" r="2" fill="#ffffff" opacity=".8"/>
    <!-- mirror -->
    <rect x="148" y="74" width="8" height="5" rx="1" fill="#550000"/>

    <!-- front wing: swept carbon planes + red endplate -->
    <path d="M298 124 L346 120 Q350 121 346 124 L300 129 Q294 128 298 124 Z" fill="url(#carbon)"/>
    <path d="M312 117 L346 114 Q349 115 346 118 L314 121 Q309 120 312 117 Z" fill="url(#carbon)"/>
    <path d="M330 112 L336 112 L336 122 L330 122 Z" fill="url(#carbon)"/>
    <rect x="344" y="106" width="6" height="23" rx="2.5" fill="url(#endplate)"/>

    <!-- sparks off the floor -->
    <g fill="#ffd54d">
      <circle class="spark" cx="102" cy="119" r="2"/>
      <circle class="spark s2" cx="112" cy="120" r="1.6"/>
      <circle class="spark s3" cx="96" cy="120" r="1.8"/>
      <circle class="spark s4" cx="120" cy="119" r="1.4"/>
    </g>

    <!-- suspension wishbones -->
    <g stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round">
      <line x1="106" y1="100" x2="80" y2="107"/>
      <line x1="106" y1="112" x2="80" y2="113"/>
      <line x1="222" y1="102" x2="260" y2="109"/>
      <line x1="222" y1="111" x2="260" y2="115"/>
    </g>

    <!-- rear wheel -->
    <g>
      <circle cx="78" cy="110" r="24" fill="url(#tire)"/>
      <circle cx="78" cy="110" r="24" fill="none" stroke="#000" stroke-width="2" opacity=".5"/>
      <path d="M60 96 A24 24 0 0 1 78 86" fill="none" stroke="#ffffff" stroke-width="2" opacity=".25" stroke-linecap="round"/>
      <circle cx="78" cy="110" r="20" fill="none" stroke="#e10600" stroke-width="1.8" opacity=".9"/>
      <circle cx="78" cy="110" r="12" fill="#5c6166"/>
      <g class="spokes" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round">
        <line x1="78" y1="99" x2="78" y2="121"/>
        <line x1="67.5" y1="106.6" x2="88.5" y2="113.4"/>
        <line x1="71.5" y1="119" x2="84.5" y2="101"/>
      </g>
      <circle cx="78" cy="110" r="3.5" fill="#ffd200"/>
    </g>
    <!-- front wheel -->
    <g>
      <circle cx="262" cy="112" r="22" fill="url(#tire)"/>
      <circle cx="262" cy="112" r="22" fill="none" stroke="#000" stroke-width="2" opacity=".5"/>
      <path d="M246 99 A22 22 0 0 1 262 90" fill="none" stroke="#ffffff" stroke-width="2" opacity=".25" stroke-linecap="round"/>
      <circle cx="262" cy="112" r="18.5" fill="none" stroke="#e10600" stroke-width="1.8" opacity=".9"/>
      <circle cx="262" cy="112" r="11" fill="#5c6166"/>
      <g class="spokes" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round">
        <line x1="262" y1="102" x2="262" y2="122"/>
        <line x1="252.8" y1="109" x2="271.2" y2="115"/>
        <line x1="256.2" y1="120" x2="267.8" y2="104"/>
      </g>
      <circle cx="262" cy="112" r="3" fill="#ffd200"/>
    </g>

    <!-- number 5 (Vettel) -->
    <text x="110" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#fff" opacity=".95">5</text>
  </g>
</svg>
